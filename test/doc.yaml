openapi: 3.0.3
info:
  title: CareFlow EHR & Pharmacy Management System API
  description: Complete API documentation for CareFlow EHR system and Pharmacy microservice integration
  version: 1.0.0
  contact:
    name: CareFlow Support
    email: support@careflow.com

servers:
  - url: http://localhost:5000/api
    description: CareFlow EHR Development server
  - url: http://localhost:5001/api
    description: Pharmacy Microservice Development server

security:
  - BearerAuth: []
  - ApiTokenAuth: []

paths:
  # ==========================================
  # CARE FLOW EHR ENDPOINTS
  # ==========================================

  # Authentication Routes
  /auth/register:
    post:
      summary: Register a new patient
      description: Create a new patient account in the EHR system
      tags:
        - CareFlow Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: "Ali Bennani"
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                password:
                  type: string
                  minLength: 6
                  example: "123456"
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Registration successful. Please check your email."

  /auth/login:
    post:
      summary: User login
      description: Authenticate user and receive JWT tokens
      tags:
        - CareFlow Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "jwt_token_here"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "64f1a2b3c4d5e6f7g8h9i0j1"
                      name:
                        type: string
                        example: "Ali Bennani"

  # User Routes
  /user/me:
    get:
      summary: Get current user profile
      description: Retrieve the current authenticated user's profile information
      tags:
        - CareFlow User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "64f1a2b3c4d5e6f7g8h9i0j1"
                  name:
                    type: string
                    example: "Ali Bennani"
                  email:
                    type: string
                    example: "ali@example.com"

  # Doctor Routes
  /doctor/profile/me:
    get:
      summary: Get doctor profile
      description: Retrieve the current doctor's profile information
      tags:
        - CareFlow Doctor
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Doctor profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "64f1a2b3c4d5e6f7g8h9i0j2"
                  specialization:
                    type: string
                    example: "Internal Medicine"

  /doctor/prescriptions/send-to-pharmacy:
    post:
      summary: Send prescription to pharmacy
      description: Send a prescription from CareFlow EHR to the pharmacy system
      tags:
        - CareFlow Doctor
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prescriptionId
              properties:
                prescriptionId:
                  type: string
                  example: "64f1a2b3c4d5e6f7g8h9i0j3"
      responses:
        '200':
          description: Prescription sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Prescription sent to pharmacy"
                  result:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "pending"

  # Patient Routes
  /patient/record/me:
    get:
      summary: Get patient medical record
      description: Retrieve the current patient's medical record
      tags:
        - CareFlow Patient
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Medical record retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "64f1a2b3c4d5e6f7g8h9i0j4"
                  diagnosis:
                    type: string
                    example: "Hypertension"

  # Secretary Routes
  /secretary/patients:
    post:
      summary: Create new patient
      description: Create a new patient record (Secretary only)
      tags:
        - CareFlow Secretary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: "Fatima Alaoui"
                email:
                  type: string
                  format: email
                  example: "fatima@example.com"
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "64f1a2b3c4d5e6f7g8h9i0j5"
                  name:
                    type: string
                    example: "Fatima Alaoui"

  # Admin Routes
  /admin/users:
    get:
      summary: Get all users
      description: Retrieve all system users (Admin only)
      tags:
        - CareFlow Admin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "64f1a2b3c4d5e6f7g8h9i0j1"
                        name:
                          type: string
                          example: "Ali Bennani"
                        email:
                          type: string
                          example: "ali@example.com"
                        role:
                          type: string
                          example: "patient"

  # ==========================================
  # PHARMACY MICROSERVICE ENDPOINTS
  # ==========================================

  # Pharmacy Authentication
  /auth/login:
    post:
      summary: Pharmacy staff login
      description: Authenticate pharmacy staff member
      tags:
        - Pharmacy Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "pharmacist@example.com"
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "jwt_token_here"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "64f1a2b3c4d5e6f7g8h9i0j6"
                      name:
                        type: string
                        example: "Pharmacist Name"

  # Pharmacy Prescription Routes
  /prescriptions:
    post:
      summary: Create prescription (from clinic)
      description: Create a new prescription from an external clinic system (e.g., CareFlow EHR)
      tags:
        - Pharmacy Prescriptions
      security:
        - ApiTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientName
                - doctorName
                - medications
              properties:
                patientId:
                  type: string
                  description: External patient ID from clinic system
                  example: "PAT_12345"
                patientName:
                  type: string
                  description: Patient's full name
                  example: "John Doe"
                patientAge:
                  type: integer
                  description: Patient's age
                  example: 35
                patientPhone:
                  type: string
                  description: Patient's phone number
                  example: "+212600000000"
                doctorName:
                  type: string
                  description: Doctor's full name
                  example: "Dr. Ahmed Bennani"
                doctorLicense:
                  type: string
                  description: Doctor's license number
                  example: "DOC_123456"
                clinicName:
                  type: string
                  description: Clinic or hospital name
                  example: "CareFlow Clinic Marrakech"
                medications:
                  type: array
                  description: List of prescribed medications
                  items:
                    type: object
                    required:
                      - medicationName
                      - quantity
                      - dosage
                    properties:
                      medicationName:
                        type: string
                        description: Name of the medication
                        example: "Paracetamol"
                      medicationId:
                        type: string
                        description: External medication code
                        example: "MED_001"
                      quantity:
                        type: integer
                        description: Quantity prescribed
                        example: 20
                      dosage:
                        type: string
                        description: Dosage instructions
                        example: "500mg every 8 hours"
                      duration:
                        type: string
                        description: Treatment duration
                        example: "7 days"
                      notes:
                        type: string
                        description: Additional notes for this medication
                        example: "Take after meals"
                prescriptionNotes:
                  type: string
                  description: General prescription notes
                  example: "Patient has allergy to penicillin"
                prescriptionDate:
                  type: string
                  format: date-time
                  description: Date when prescription was issued
                  example: "2024-01-15T10:30:00.000Z"
      responses:
        '201':
          description: Prescription created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Prescription created successfully"
                  data:
                    type: object
                    properties:
                      prescriptionId:
                        type: string
                        example: "PRESC_1705312200000_abc123def"
                      status:
                        type: string
                        example: "pending"
                      totalCost:
                        type: number
                        example: 45.50
                      estimatedReadyTime:
                        type: string
                        format: date-time
                        example: "2024-01-15T11:00:00.000Z"
                      medications:
                        type: array
                        items:
                          type: object
                          properties:
                            medicationId:
                              type: string
                              example: "64f1a2b3c4d5e6f7g8h9i0j1"
                            medicationName:
                              type: string
                              example: "Paracetamol"
                            quantity:
                              type: integer
                              example: 20
                            dosage:
                              type: string
                              example: "500mg every 8 hours"
                            duration:
                              type: string
                              example: "7 days"
                            notes:
                              type: string
                              example: "Take after meals"
                            price:
                              type: number
                              example: 2.50
                            totalPrice:
                              type: number
                              example: 50.00

    get:
      summary: Get all prescriptions for client
      description: Retrieve all prescriptions for the authenticated client with optional filtering
      tags:
        - Pharmacy Prescriptions
      security:
        - ApiTokenAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: perPage
          in: query
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, ready, completed, cancelled]
          description: Filter by prescription status
        - name: patientName
          in: query
          schema:
            type: string
          description: Filter by patient name (case-insensitive)
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Filter prescriptions from this date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: Filter prescriptions until this date
      responses:
        '200':
          description: Prescriptions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Prescriptions retrieved successfully"
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 25
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 10
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "64f1a2b3c4d5e6f7g8h9i0j1"
                            prescriptionId:
                              type: string
                              example: "PRESC_1705312200000_abc123def"
                            patientId:
                              type: string
                              example: "PAT_12345"
                            patientName:
                              type: string
                              example: "John Doe"
                            patientAge:
                              type: integer
                              example: 35
                            patientPhone:
                              type: string
                              example: "+212600000000"
                            doctorName:
                              type: string
                              example: "Dr. Ahmed Bennani"
                            doctorLicense:
                              type: string
                              example: "DOC_123456"
                            clinicName:
                              type: string
                              example: "CareFlow Clinic Marrakech"
                            medications:
                              type: array
                              items:
                                type: object
                                properties:
                                  medicationId:
                                    type: string
                                    example: "64f1a2b3c4d5e6f7g8h9i0j2"
                                  medicationName:
                                    type: string
                                    example: "Paracetamol"
                                  quantity:
                                    type: integer
                                    example: 20
                                  dosage:
                                    type: string
                                    example: "500mg every 8 hours"
                                  duration:
                                    type: string
                                    example: "7 days"
                                  notes:
                                    type: string
                                    example: "Take after meals"
                                  price:
                                    type: number
                                    example: 2.50
                                  totalPrice:
                                    type: number
                                    example: 50.00
                            prescriptionNotes:
                              type: string
                              example: "Patient has allergy to penicillin"
                            prescriptionDate:
                              type: string
                              format: date-time
                              example: "2024-01-15T10:30:00.000Z"
                            status:
                              type: string
                              enum: [pending, processing, ready, completed, cancelled]
                              example: "pending"
                            totalCost:
                              type: number
                              example: 45.50
                            notes:
                              type: string
                              example: "Pharmacy notes"
                            processedBy:
                              type: string
                              example: "64f1a2b3c4d5e6f7g8h9i0j3"
                            processedAt:
                              type: string
                              format: date-time
                              example: "2024-01-15T11:00:00.000Z"
                            readyAt:
                              type: string
                              format: date-time
                              example: "2024-01-15T11:30:00.000Z"
                            completedAt:
                              type: string
                              format: date-time
                              example: "2024-01-15T12:00:00.000Z"
                            createdAt:
                              type: string
                              format: date-time
                              example: "2024-01-15T10:30:00.000Z"
                            updatedAt:
                              type: string
                              format: date-time
                              example: "2024-01-15T11:00:00.000Z"

  /prescriptions/statistics:
    get:
      summary: Get prescription statistics for client
      description: Retrieve aggregated statistics for prescriptions
      tags:
        - Pharmacy Prescriptions
      security:
        - ApiTokenAuth: []
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Start date for statistics
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: End date for statistics
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Statistics retrieved successfully"
                  data:
                    type: object
                    properties:
                      totalPrescriptions:
                        type: integer
                        example: 150
                      totalCost:
                        type: number
                        example: 12500.75
                      pendingCount:
                        type: integer
                        example: 12
                      completedCount:
                        type: integer
                        example: 138

  /prescriptions/{id}:
    get:
      summary: Get prescription by ID
      description: Retrieve a specific prescription by its ID
      tags:
        - Pharmacy Prescriptions
      security:
        - ApiTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Prescription ID
      responses:
        '200':
          description: Prescription retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Prescription retrieved successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "64f1a2b3c4d5e6f7g8h9i0j1"
                      prescriptionId:
                        type: string
                        example: "PRESC_1705312200000_abc123def"
                      patientId:
                        type: string
                        example: "PAT_12345"
                      patientName:
                        type: string
                        example: "John Doe"
                      patientAge:
                        type: integer
                        example: 35
                      patientPhone:
                        type: string
                        example: "+212600000000"
                      doctorName:
                        type: string
                        example: "Dr. Ahmed Bennani"
                      doctorLicense:
                        type: string
                        example: "DOC_123456"
                      clinicName:
                        type: string
                        example: "CareFlow Clinic Marrakech"
                      clientId:
                        type: string
                        example: "64f1a2b3c4d5e6f7g8h9i0j4"
                      medications:
                        type: array
                        items:
                          type: object
                          properties:
                            medicationId:
                              type: string
                              example: "64f1a2b3c4d5e6f7g8h9i0j2"
                            medicationName:
                              type: string
                              example: "Paracetamol"
                            quantity:
                              type: integer
                              example: 20
                            dosage:
                              type: string
                              example: "500mg every 8 hours"
                            duration:
                              type: string
                              example: "7 days"
                            notes:
                              type: string
                              example: "Take after meals"
                            price:
                              type: number
                              example: 2.50
                            totalPrice:
                              type: number
                              example: 50.00
                      prescriptionNotes:
                        type: string
                        example: "Patient has allergy to penicillin"
                      prescriptionDate:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:30:00.000Z"
                      status:
                        type: string
                        enum: [pending, processing, ready, completed, cancelled]
                        example: "pending"
                      totalCost:
                        type: number
                        example: 45.50
                      notes:
                        type: string
                        example: "Pharmacy notes"
                      processedBy:
                        type: string
                        example: "64f1a2b3c4d5e6f7g8h9i0j3"
                      processedAt:
                        type: string
                        format: date-time
                        example: "2024-01-15T11:00:00.000Z"
                      readyAt:
                        type: string
                        format: date-time
                        example: "2024-01-15T11:30:00.000Z"
                      completedAt:
                        type: string
                        format: date-time
                        example: "2024-01-15T12:00:00.000Z"
                      createdAt:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:30:00.000Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2024-01-15T11:00:00.000Z"

    put:
      summary: Update prescription status
      description: Update the status of a prescription
      tags:
        - Pharmacy Prescriptions
      security:
        - ApiTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Prescription ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, processing, ready, completed, cancelled]
                  example: "completed"
                notes:
                  type: string
                  description: Additional notes for status update
                  example: "Prescription ready for pickup"
      responses:
        '200':
          description: Prescription status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Prescription status updated successfully"
                  data:
                    type: object
                    properties:
                      prescriptionId:
                        type: string
                        example: "PRESC_1705312200000_abc123def"
                      status:
                        type: string
                        example: "completed"
                      notes:
                        type: string
                        example: "Prescription ready for pickup"

  /medications:
    get:
      summary: Get available medications
      description: Retrieve list of available medications with optional filtering
      tags:
        - Pharmacy Medications
      security:
        - ApiTokenAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: perPage
          in: query
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - name: search
          in: query
          schema:
            type: string
          description: Search by medication name or code
        - name: category
          in: query
          schema:
            type: string
          description: Filter by medication category
        - name: requiresPrescription
          in: query
          schema:
            type: string
            enum: [true, false]
          description: Filter by prescription requirement
      responses:
        '200':
          description: Medications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Medications retrieved successfully"
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 150
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 10
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "64f1a2b3c4d5e6f7g8h9i0j1"
                            name:
                              type: string
                              example: "Paracetamol"
                            code:
                              type: string
                              example: "PAR_500"
                            description:
                              type: string
                              example: "Pain relief medication"
                            stockQuantity:
                              type: integer
                              example: 500
                            unit:
                              type: string
                              example: "tablets"
                            price:
                              type: number
                              example: 2.50
                            requiresPrescription:
                              type: boolean
                              example: false
                            category:
                              type: string
                              example: "Pain Relief"

  # ==========================================
  # INTER-SERVICE COMMUNICATION ENDPOINTS
  # ==========================================

  # Pharmacy to CareFlow Verification Endpoints (Future Implementation)
  /verify/patient/{patientId}:
    get:
      summary: Verify patient information
      description: Pharmacy verifies patient data with CareFlow EHR (requires JWT)
      tags:
        - Inter-Service Communication
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
          description: Patient ID to verify
      responses:
        '200':
          description: Patient verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  patient:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "64f1a2b3c4d5e6f7g8h9i0j1"
                      name:
                        type: string
                        example: "John Doe"
                      dateOfBirth:
                        type: string
                        format: date
                        example: "1990-01-15"
                      bloodType:
                        type: string
                        example: "A+"

  /verify/doctor/{doctorId}:
    get:
      summary: Verify doctor information
      description: Pharmacy verifies doctor credentials with CareFlow EHR (requires JWT)
      tags:
        - Inter-Service Communication
      security:
        - BearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
          description: Doctor ID to verify
      responses:
        '200':
          description: Doctor verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  doctor:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "64f1a2b3c4d5e6f7g8h9i0j2"
                      name:
                        type: string
                        example: "Dr. Ahmed Bennani"
                      license:
                        type: string
                        example: "DOC_123456"
                      specialization:
                        type: string
                        example: "Internal Medicine"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT token authentication for CareFlow EHR users
    ApiTokenAuth:
      type: http
      scheme: bearer
      description: API token authentication for Pharmacy clients. Use format "Bearer ph_sk_xxxxxxxxxxxxxxxx"

  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "Error description"
        stack:
          type: string
          example: null

    CareFlowUser:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [patient, doctor, nurse, secretary, admin]
        status:
          type: string
          enum: [active, suspended, pending_verification]
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PharmacyPrescription:
      type: object
      properties:
        id:
          type: string
        prescriptionId:
          type: string
        patientId:
          type: string
        patientName:
          type: string
        patientAge:
          type: integer
        patientPhone:
          type: string
        doctorName:
          type: string
        doctorLicense:
          type: string
        clinicName:
          type: string
        clientId:
          type: string
        medications:
          type: array
          items:
            $ref: '#/components/schemas/PharmacyMedicationItem'
        prescriptionNotes:
          type: string
        prescriptionDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, processing, ready, completed, cancelled]
        totalCost:
          type: number
        notes:
          type: string
        processedBy:
          type: string
        processedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PharmacyMedicationItem:
      type: object
      properties:
        medicationId:
          type: string
        medicationName:
          type: string
        quantity:
          type: integer
        dosage:
          type: string
        duration:
          type: string
        notes:
          type: string
        price:
          type: number
        totalPrice:
          type: number

    PharmacyMedication:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: string
        stockQuantity:
          type: integer
        unit:
          type: string
        price:
          type: number
        requiresPrescription:
          type: boolean
        category:
          type: string

